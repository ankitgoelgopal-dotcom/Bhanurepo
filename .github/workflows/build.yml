name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore $RUNNER_TEMP/release.jks -storetype PKCS12 \
            -alias freebrowser -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass freebrowser123 -keypass freebrowser123 -dname "CN=FreeBrowser"
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: freebrowser123
        run: |
          export KEYSTORE_PATH=$RUNNER_TEMP/release.jks
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FreeBrowser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
