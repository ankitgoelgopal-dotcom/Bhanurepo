name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project FreeBrowser.xcodeproj -scheme FreeBrowser -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload && cp -r FreeBrowser.app Payload/
          zip -qr "$GITHUB_WORKSPACE/FreeBrowser.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FreeBrowser-ipa
          path: FreeBrowser.ipa
