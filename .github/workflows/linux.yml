name: Build Linux AppImage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/linux.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build AppImage
        working-directory: desktop
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: FreeBrowser-linux
          path: desktop/dist/FreeBrowser.AppImage
