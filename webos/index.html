<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeBrowser</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif;font-size:28px}
#wrap{padding:60px 90px}h1{margin:0 0 30px;font-size:52px}
#row{display:flex}#addr{flex:1;font-size:32px;padding:16px 22px;background:#222;color:#fff;border:3px solid #444;border-radius:10px}
button{font-size:28px;padding:16px 26px;margin-left:14px;background:#333;color:#fff;border:3px solid #444;border-radius:10px}
#tiles{display:flex;flex-wrap:wrap;margin-top:40px}
#tiles button{width:360px;height:120px;margin:0 20px 20px 0}
#bar{margin-top:10px}#bar button{margin:0 14px 0 0;font-size:24px}
button:focus,input:focus{outline:none;border-color:#6ea0ff;background:#2d4a8a}
#msg{margin-top:30px;color:#aaa;font-size:22px}
</style></head><body><div id="wrap">
<h1>FreeBrowser</h1>
<div id="row"><input id="addr" type="text" placeholder="Search or enter address" autocomplete="off"><button id="go">Go</button></div>
<div id="tiles"></div>
<div id="bar"><button id="add">Add tile</button><button id="edit">Remove tiles: off</button><button id="reset">Reset tiles</button></div>
<div id="msg">Use the remote. Press Back on a website to return here.</div>
</div>
<script>
(function () {
  var SEARCH = 'https://duckduckgo.com/?q=%s';
  var DEFAULTS = [
    { n: 'DuckDuckGo', u: 'https://duckduckgo.com' },
    { n: 'YouTube TV', u: 'https://www.youtube.com/tv' },
    { n: 'Wikipedia', u: 'https://www.wikipedia.org' },
    { n: 'Reddit', u: 'https://old.reddit.com' }
  ];
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var tiles = load('tiles', DEFAULTS), editing = false;
  var addr = document.getElementById('addr');

  function resolve(t) {
    t = t.replace(/^\s+|\s+$/g, '');
    if (!t) return null;
    if (/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(t)) return t;
    if (t.indexOf(' ') < 0 && (t.indexOf('.') > 0 || t.indexOf('localhost') === 0)) return 'https://' + t;
    return SEARCH.replace('%s', encodeURIComponent(t));
  }
  function go(url) { if (url) window.location.href = url; }
  function host(u) { var m = u.match(/^[a-z]+:\/\/([^\/]+)/i); return m ? m[1].replace(/^www\./, '') : u; }

  function render() {
    var box = document.getElementById('tiles'); box.innerHTML = '';
    tiles.forEach(function (t, i) {
      var b = document.createElement('button'); b.textContent = t.n;
      b.onclick = function () {
        if (editing) { tiles.splice(i, 1); save('tiles', tiles); render(); b = null; focusFirst(); }
        else go(t.u);
      };
      box.appendChild(b);
    });
  }
  function focusFirst() { var f = document.querySelector('#tiles button') || addr; f.focus(); }

  document.getElementById('go').onclick = function () { go(resolve(addr.value)); };
  addr.onkeydown = function (e) { if (e.keyCode === 13) go(resolve(addr.value)); };
  document.getElementById('add').onclick = function () {
    var u = resolve(addr.value); if (!u || u.indexOf(SEARCH.split('%s')[0]) === 0) return;
    tiles.push({ n: host(u), u: u }); save('tiles', tiles); render();
  };
  document.getElementById('edit').onclick = function () {
    editing = !editing; this.textContent = 'Remove tiles: ' + (editing ? 'ON' : 'off');
  };
  document.getElementById('reset').onclick = function () { tiles = DEFAULTS.slice(); save('tiles', tiles); render(); };

  // Arrow-key (D-pad) navigation between buttons and the address box
  document.addEventListener('keydown', function (e) {
    var dir = { 37: 'l', 38: 'u', 39: 'r', 40: 'd' }[e.keyCode]; if (!dir) return;
    var cur = document.activeElement;
    if (cur && cur.tagName === 'INPUT' && (dir === 'l' || dir === 'r')) return;
    var els = [].slice.call(document.querySelectorAll('button,input'));
    if (!cur || els.indexOf(cur) < 0) { els[0].focus(); e.preventDefault(); return; }
    var r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, best = null, bs = 1e9;
    els.forEach(function (el) {
      if (el === cur) return;
      var q = el.getBoundingClientRect(), x = q.left + q.width / 2, y = q.top + q.height / 2, dx = x - cx, dy = y - cy, p, s;
      if (dir === 'l' && dx < -5) { p = -dx; s = Math.abs(dy); }
      else if (dir === 'r' && dx > 5) { p = dx; s = Math.abs(dy); }
      else if (dir === 'u' && dy < -5) { p = -dy; s = Math.abs(dx); }
      else if (dir === 'd' && dy > 5) { p = dy; s = Math.abs(dx); }
      else return;
      var score = p + 3 * s; if (score < bs) { bs = score; best = el; }
    });
    if (best) { best.focus(); e.preventDefault(); }
  });
  render(); addr.focus();
})();
</script></body></html>
